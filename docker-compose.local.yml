# Uso local/pruebas, sin Traefik: expone el contenedor directo en el puerto 3000.
# docker compose -f docker-compose.local.yml up --build
services:
  tienda:
    build:
      context: .
      dockerfile: Dockerfile
    image: icr-tienda:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
